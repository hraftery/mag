# Managed by setup.sh - installed to /etc/nginx/sites-available/mag-proxy.conf
# and symlinked into sites-enabled/. Re-running setup.sh overwrites it, so
# edit this source file, not the installed copy. __MAG_DOMAIN__ is
# substituted from .env's MAG_DOMAIN.
server {
    listen 443 ssl;
    server_name __MAG_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__MAG_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MAG_DOMAIN__/privkey.pem;

    location /callback {
        proxy_pass http://127.0.0.1:8787;
    }

    location /proxy/ {
        proxy_pass http://127.0.0.1:8788;
    }
}
